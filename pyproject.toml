[project]
name = "overleaf-mcp-server"
version = "0.1.0"
description = "MCP server for Overleaf projects via Git sync"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Younes Bensafia" }]
keywords = ["overleaf", "mcp", "git", "latex", "sharelatex"]
dependencies = [
    "gitpython>=3.1.46",
    "mcp>=1.26.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "SIM", "ARG"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = [".venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
